version: '3.8'

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: ${DB_NAME:-Via-Exam}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - node-network

  email:
    image: rnwood/smtp4dev:v3
    ports:
      - '3005:80'
      - '2525:25'
    networks:
      - node-network

  node-app:
    build: .
    image: via-exam-backend
    env_file:
      - .env
    environment:
      # Override DB_HOST to point to the docker container network instead of the remote IP
      - DB_HOST=postgres
    ports:
      - '5020:5020'
    depends_on:
      - postgres
      - email
    volumes:
      - .:/usr/src/node-app
      # Anonymous volume for node_modules so the host node_modules don't overwrite the container's
      - /usr/src/node-app/node_modules
    networks:
      - node-network

volumes:
  postgres-data:
    driver: local

networks:
  node-network:
    driver: bridge